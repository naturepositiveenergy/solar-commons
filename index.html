<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131916" media="(prefers-color-scheme: dark)">
<!-- The page title is filled in from the language files -->
<title data-i18n="app.pageTitle"></title>
<!-- App icon and app description for installing the game (icons made by tools/make-icons.js) -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- ?v=... makes browsers load fresh copies after an update: change it with every update (see docs/publishing.md) -->
<!-- The fonts are stored in the project (fonts/, made by tools/make-fonts.js) -->
<link rel="stylesheet" href="fonts/fonts.css?v=m11">
<link rel="stylesheet" href="css/style.css?v=m11">
<link rel="stylesheet" href="css/game.css?v=m11">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <!-- Only shown during a game -->
      <button type="button" class="btn-link" id="toTitleBtn" data-i18n="game.toTitle" hidden></button>
      <!-- Policy notebook (js/notebook.js); its text and "new" count are filled in by code -->
      <button type="button" class="btn-link" id="notebookBtn" data-nb=""></button>
      <!-- How to play (js/help.js) -->
      <button type="button" class="btn-link" id="helpBtn" data-help="" data-i18n="help.button"></button>
    </div>
    <!-- Language buttons are added by js/main.js, one per language file -->
    <nav class="lang-switch" id="langSwitch" data-i18n-aria-label="lang.switchLabel"></nav>
  </header>

  <main>
    <!-- Start screen -->
    <section class="screen screen-start" id="screen-start">
      <div class="motif" id="motif" aria-hidden="true"></div>
      <h1 class="title" tabindex="-1" data-i18n="app.title"></h1>
      <p class="subtitle" data-i18n="start.subtitle"></p>
      <div class="start-buttons">
        <button type="button" class="btn btn-primary" id="continueBtn" data-i18n="start.continue" hidden></button>
        <!-- Its text is set by js/main.js: "New game", or "Start scenario 2417" for a link with a code -->
        <button type="button" class="btn btn-primary" id="newGameBtn"></button>
      </div>
      <p class="saved-note" id="savedNote" data-i18n="start.savedNote" hidden></p>
      <p class="saved-note" id="outdatedNote" data-i18n="start.outdatedSave" hidden></p>
      <!-- Scenario codes: everyone with the same code gets the same sites and events -->
      <p class="start-code"><button type="button" class="btn-link" id="codeBtn" data-i18n="start.enterCode"></button></p>
      <!-- For workshop facilitators: the results board (results.html) -->
      <p class="start-code start-board"><a class="btn-link" href="results.html" data-i18n="start.boardLink"></a></p>
      <!-- Installing and playing offline (js/offline.js): each part is shown only when it applies -->
      <div class="start-install">
        <button type="button" class="btn btn-small btn-quiet" id="installBtn" data-i18n="start.install" hidden></button>
        <p class="start-note" id="installHint" data-i18n="start.installHint" hidden></p>
        <p class="start-note" id="offlineNote" data-i18n="start.offlineReady" hidden></p>
      </div>
    </section>

    <!-- Game screen: its contents are drawn by js/game-screen.js -->
    <section class="screen screen-game" id="screen-game" hidden>
      <h1 class="visually-hidden" tabindex="-1" data-i18n="game.heading"></h1>
      <div id="gameView"></div>
    </section>

    <!-- End screen: its contents (including the heading) are drawn by js/end-screen.js -->
    <section class="screen screen-end" id="screen-end" hidden>
      <div id="endView"></div>
    </section>
  </main>
</div>

<!-- Pop-up: design panel (js/design-panel.js) -->
<dialog class="dialog dialog-large" id="designDialog" aria-labelledby="designTitle">
  <form method="dialog" class="dialog-frame" novalidate>
    <div class="dialog-head"><h2 id="designTitle" tabindex="-1"></h2></div>
    <div class="dialog-scroll" id="designForm"></div>
    <div class="dialog-foot">
      <dl class="design-summary" id="designSummary"></dl>
      <p class="design-problem" id="designProblem" role="alert"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn" id="designCancel"></button>
        <button type="submit" value="ok" class="btn btn-primary" id="designOk"></button>
      </div>
    </div>
  </form>
</dialog>

<!-- Pop-up: report after each turn -->
<dialog class="dialog" id="reportDialog" aria-labelledby="reportTitle">
  <form method="dialog">
    <h2 id="reportTitle"></h2>
    <div id="reportBody"></div>
    <div class="dialog-actions"><button type="submit" value="ok" class="btn btn-primary" id="reportContinue" autofocus></button></div>
  </form>
</dialog>

<!-- Pop-up: policy notebook (js/notebook.js) -->
<dialog class="dialog dialog-large" id="notebookDialog" aria-labelledby="notebookTitle">
  <form method="dialog" class="dialog-frame">
    <div class="dialog-head"><h2 id="notebookTitle" tabindex="-1"></h2></div>
    <div class="dialog-scroll" id="notebookBody"></div>
    <div class="dialog-foot">
      <div class="dialog-actions"><button type="submit" value="close" class="btn" id="notebookClose"></button></div>
    </div>
  </form>
</dialog>

<!-- Pop-up: yes/no questions -->
<dialog class="dialog" id="confirmDialog" aria-labelledby="confirmTitle">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button type="submit" value="cancel" class="btn" id="confirmCancel"></button>
      <button type="submit" value="ok" class="btn btn-primary" id="confirmOk"></button>
    </div>
  </form>
</dialog>

<!-- Pop-up: how to play (js/help.js) -->
<dialog class="dialog dialog-large" id="helpDialog" aria-labelledby="helpTitle">
  <form method="dialog" class="dialog-frame">
    <div class="dialog-head"><h2 id="helpTitle" tabindex="-1"></h2></div>
    <div class="dialog-scroll" id="helpBody"></div>
    <div class="dialog-foot help-foot">
      <label class="help-hints"><input type="checkbox" id="helpHints"> <span data-i18n="help.showHints"></span></label>
      <div class="dialog-actions"><button type="submit" value="close" class="btn" data-i18n="common.close"></button></div>
    </div>
  </form>
</dialog>

<!-- Pop-up: start a game with a scenario code (js/main.js) -->
<dialog class="dialog" id="codeDialog" aria-labelledby="codeTitle">
  <form method="dialog" id="codeForm" novalidate>
    <h2 id="codeTitle" data-i18n="code.title"></h2>
    <p data-i18n="code.text"></p>
    <label class="code-field">
      <span data-i18n="code.label"></span>
      <input id="codeInput" type="text" inputmode="numeric" maxlength="4" autocomplete="off" aria-describedby="codeProblem">
    </label>
    <p class="design-problem" id="codeProblem" role="alert"></p>
    <div class="dialog-actions">
      <button type="submit" value="cancel" class="btn" data-i18n="common.cancel"></button>
      <button type="submit" value="ok" class="btn btn-primary" id="codeOk" data-i18n="code.start"></button>
    </div>
  </form>
</dialog>

<!-- Short messages -->
<p class="toast" id="toast" role="status" aria-live="polite"></p>

<!-- Order matters: language system, texts (Japanese first = first in the switch), rules,
     helpers, then the screens, and main.js last -->
<script src="js/i18n.js?v=m11"></script>
<script src="lang/ja.js?v=m11"></script>
<script src="lang/en.js?v=m11"></script>
<script src="js/engine.js?v=m11"></script>
<script src="js/ui.js?v=m11"></script>
<script src="js/save.js?v=m11"></script>
<script src="js/game-screen.js?v=m11"></script>
<script src="js/map-editor.js?v=m11"></script>
<script src="js/design-panel.js?v=m11"></script>
<script src="js/results-code.js?v=m11"></script>
<script src="js/end-screen.js?v=m11"></script>
<script src="js/notebook.js?v=m11"></script>
<script src="js/offline.js?v=m11"></script>
<script src="js/help.js?v=m11"></script>
<script src="js/main.js?v=m11"></script>
</body>
</html>
